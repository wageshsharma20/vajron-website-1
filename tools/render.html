<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UAS render</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<link href="https://fonts.googleapis.com/css2?family=Manrope:ital,wght@0,800&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// Deterministic shot renderer for the VAJRON Inspection UAS (light studio).
import * as THREE from 'three';
import { createStage } from './stage.js';
import { buildUAS, LAYOUT } from './uas.js';

const canvas = document.getElementById('c');
let S, D, W = 1920, H = 1080, alpha = false, orthoCam, bgTex, floorMesh;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const smooth = (a, b, t) => { const x = clamp((t - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };
const lerp = (a, b, k) => a + (b - a) * k;
const lerpV = (a, b, k) => a.map((v, i) => lerp(v, b[i], k));
const TAU = Math.PI * 2;
const FLOOR = LAYOUT.footY - 0.0125;

function studioBackground() {
  const cv = document.createElement('canvas'); cv.width = 1920; cv.height = 1080;
  const c = cv.getContext('2d');
  const g = c.createRadialGradient(960, 520, 60, 960, 560, 1250);
  g.addColorStop(0, '#f4f5f7'); g.addColorStop(0.5, '#e2e4e8'); g.addColorStop(1, '#b9bdc4');
  c.fillStyle = g; c.fillRect(0, 0, 1920, 1080);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}

// shots: cam, tgt, fov, y (lift), spin (0..1), gear (1 deployed), pan, tilt, floor
const Y0 = 0;
const SHOTS = {
  // film chapters
  f_airframe:  { dur: 3.0, f: (t) => { const a = lerp(0.5, 0.95, smooth(0, 3, t)); return { cam: [1.25 * Math.cos(a), 0.42, 1.25 * Math.sin(a)], tgt: [0, -0.04, 0], fov: 30 }; } },
  f_camera:    { dur: 3.0, f: (t) => { const k = smooth(0, 3, t); return { cam: lerpV([0.5, -0.11, 0.22], [0.4, -0.12, 0.12], k), tgt: [0.06, -0.14, 0], fov: 28, pan: lerp(-0.25, 0.25, k), tilt: 0.06 * Math.sin(t * 2) }; } },
  f_lidar:     { dur: 3.0, f: (t) => { const a = lerp(-0.35, 0.35, smooth(0, 3, t)); return { cam: [0.34 * Math.cos(a), 0.085, 0.34 * Math.sin(a)], tgt: [0, 0.07, 0], fov: 28 }; } },
  f_vision:    { dur: 2.8, f: (t) => { const k = smooth(0, 2.8, t); return { cam: lerpV([0.46, 0.2, 0.16], [0.34, 0.17, 0.06], k), tgt: [0.095, 0.15, 0], fov: 26 }; } },
  f_arms:      { dur: 2.8, f: (t) => { const a = 0.3 + 0.5 * smooth(0, 2.8, t); return { cam: [0.28 * Math.cos(a), 1.35, 0.28 * Math.sin(a)], tgt: [0, 0, 0], fov: 34, spin: smooth(0.2, 1.6, t) }; } },
  f_uplidar:   { dur: 2.8, f: (t) => { const a = lerp(-0.25, 0.25, smooth(0, 2.8, t)); return { cam: [0.3 * Math.cos(a), 0.44, 0.3 * Math.sin(a)], tgt: [0.02, 0.2, 0], fov: 28 }; } },
  f_downlidar: { dur: 3.0, f: (t) => { const k = smooth(0, 3, t); return { cam: [lerp(0.04, -0.06, k), -0.37, lerp(0.24, 0.2, k)], tgt: [-0.03, -0.077, 0], fov: 32 }; } },
  f_rtk:       { dur: 2.8, f: (t) => { const a = lerp(-0.6, 0.1, smooth(0, 2.8, t)); return { cam: [0.34 * Math.cos(a), 0.3, 0.34 * Math.sin(a)], tgt: [-0.01, 0.215, 0], fov: 26 }; } },
  f_battery:   { dur: 3.2, f: (t) => { const a = Math.PI + lerp(-0.7, -0.2, smooth(0, 3.2, t)); return { cam: [0.46 * Math.cos(a), 0.1, 0.46 * Math.sin(a)], tgt: [-0.1, -0.04, 0], fov: 30 }; } },
  // loops
  lidar:     { dur: 6, f: (t) => { const a = 0.32 * Math.sin(TAU * t / 6); return { cam: [0.34 * Math.cos(a), 0.085, 0.34 * Math.sin(a)], tgt: [0, 0.07, 0], fov: 28 }; } },
  vision:    { dur: 6, f: (t) => { const a = 0.24 * Math.sin(TAU * t / 6); return { cam: [0.1 + 0.3 * Math.cos(a), 0.18, 0.3 * Math.sin(a)], tgt: [0.095, 0.15, 0], fov: 26 }; } },
  uplidar:   { dur: 6, f: (t) => { const a = 0.25 * Math.sin(TAU * t / 6); return { cam: [0.3 * Math.cos(a), 0.44, 0.3 * Math.sin(a)], tgt: [0.02, 0.2, 0], fov: 28 }; } },
  downlidar: { dur: 6, f: (t) => { const u = Math.sin(TAU * t / 6); return { cam: [-0.01 + 0.05 * u, -0.37, 0.22], tgt: [-0.03, -0.077, 0], fov: 32 }; } },
  camera:    { dur: 6, f: (t) => ({ cam: [0.46, -0.12, 0.17], tgt: [0.06, -0.14, 0], fov: 28, pan: 0.3 * Math.sin(TAU * t / 6), tilt: 0.08 * Math.sin(TAU * 2 * t / 6) }) },
  intro:     { dur: 6, f: (t) => { const k = 0.5 - 0.5 * Math.cos(TAU * t / 6); return { cam: [lerp(1.3, 1.0, k), lerp(0.05, 0.02, k), 0.0], tgt: [0, -0.06, 0], fov: 30 }; } },
  airframe:  { dur: 10, f: (t) => { const a = 0.4 + TAU * t / 10; return { cam: [0.3 * Math.cos(a), 1.35, 0.3 * Math.sin(a)], tgt: [0, 0, 0], fov: 34, spin: 0 }; } },
  rtk:       { dur: 6, f: (t) => { const a = -0.25 + 0.35 * Math.sin(TAU * t / 6); return { cam: [0.34 * Math.cos(a), 0.3, 0.34 * Math.sin(a)], tgt: [-0.01, 0.215, 0], fov: 26 }; } },
  battery:   { dur: 6, f: (t) => { const a = Math.PI - 0.45 + 0.3 * Math.sin(TAU * t / 6); return { cam: [0.46 * Math.cos(a), 0.1, 0.46 * Math.sin(a)], tgt: [-0.1, -0.04, 0], fov: 30 }; } },
  // stills
  hero:  { dur: 0, f: () => ({ cam: [1.2, 0.62, 0.78], tgt: [0, -0.03, 0], fov: 30 }) },
  hero2: { dur: 0, f: () => ({ cam: [1.35, 0.22, 0.62], tgt: [0, -0.04, 0], fov: 30 }) },
  front: { dur: 0, ortho: 'front' },
};

let shot = null, lastT = 0;
function applyState(st, dt) {
  D.group.position.y = st.y || 0;
  D.spin(st.spin || 0, dt);
  D.setGear(st.gear ?? 1);
  D.aimGimbal(st.pan || 0, st.tilt || 0);
  S.camera.fov = st.fov || 30;
  S.camera.position.set(...st.cam); S.camera.lookAt(...st.tgt);
  S.camera.near = 0.01; S.camera.updateProjectionMatrix();
}

function setOrtho() {
  D.spin(0, 0); D.setGear(1); D.aimGimbal(0, 0);
  D.parts.rotors.forEach((r, i) => { r.prop.rotation.y = [0.5, -0.5, 0.5, -0.5][i] + Math.PI / 2; });
  const box = new THREE.Box3().setFromObject(D.group, true);
  const size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const aspect = W / H, pad = 1.08;
  let hw = size.z * pad / 2, hh = size.y * pad / 2;
  if (hw / hh < aspect) hw = hh * aspect; else hh = hw / aspect;
  orthoCam = new THREE.OrthographicCamera(-hw, hw, hh, -hh, 0.01, 20);
  orthoCam.position.set(6, c.y, c.z); orthoCam.lookAt(c); orthoCam.updateProjectionMatrix();
}

window.R = {
  ready: false,
  async init(cfg = {}) {
    await document.fonts.load('italic 800 40px Manrope').catch(() => {});
    W = cfg.w || 1920; H = cfg.h || 1080; alpha = !!cfg.alpha;
    canvas.width = W; canvas.height = H; canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    S = createStage(canvas, { alpha, capture: true, pixelRatio: cfg.pr || 1, envIntensity: cfg.env ?? 0.95, groundY: FLOOR, contactW: 1.1, contactD: 1.1, shadowExtent: 1.2, key: 2.1, rim: 1.5, fill: 0.55 });
    S.resize(W, H);
    S.contact.material.opacity = cfg.contact ?? 0.55;
    D = buildUAS(THREE); S.scene.add(D.group);
    if (!alpha) {
      bgTex = studioBackground(); S.scene.background = bgTex;
      S.floor.visible = true; S.floor.material.opacity = 0.28; S.key.castShadow = true;
      S.scene.fog = new THREE.Fog(0xd9dbe0, 4, 12);
    }
    if (cfg.white) { S.scene.background = new THREE.Color(0xffffff); S.floor.visible = false; S.scene.fog = null; }
    return { w: W, h: H };
  },
  shot(name) {
    shot = SHOTS[name]; lastT = 0;
    D.parts.rotors.forEach((r, i) => { r.angle = i * 0.9 + 0.4; });
    if (shot.ortho) { setOrtho(); return 0; }
    return shot.dur;
  },
  at(t, type = 'image/jpeg', q = 0.93) {
    const dt = shot.dur ? Math.max(0, t - lastT) : 0;
    if (shot.ortho) S.renderer.render(S.scene, orthoCam);
    else {
      const steps = Math.max(1, Math.round(dt * 60));
      for (let s = 1; s <= steps; s++) applyState(shot.f(lastT + (dt * s) / steps), dt / steps);
      if (!dt) applyState(shot.f(t), 0);
      S.render();
    }
    lastT = t;
    return canvas.toDataURL(type, q);
  },
  project(points) {
    const box = new THREE.Box3().setFromObject(D.group, true);
    const cam = orthoCam; cam.updateMatrixWorld();
    // map to 0..100 % of the full frame
    return points.map(([x, y, z]) => { const p = new THREE.Vector3(x, y, z).project(cam); return [+(((p.x + 1) / 2) * 100).toFixed(2), +(((1 - p.y) / 2) * 100).toFixed(2)]; });
  },
};
window.R.ready = true;
</script>
</body>
</html>
